<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>Schokoladenfabrik</title>
<style>
:root{color-scheme:light;--wall1:#efe8dc;--wall2:#dcd2c2;--ui:#fffaf0;--ink:#3a2414;--accent:#e8892b;--accentDark:#b0631a;--ok:#4a9a3c;--choco:#5a2e14}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;overscroll-behavior:none;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(var(--wall1),var(--wall2));user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer}
*,*::before,*::after{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
[hidden]{display:none!important}
#game{position:fixed;inset:0;overflow:hidden;touch-action:none}
#far,#world{position:absolute;left:0;top:0;height:500px;transform-origin:0 0}
#far{width:4000px}
#world{width:3400px}
#soil{position:absolute;left:0;right:0;bottom:0;display:none;background:repeating-linear-gradient(90deg,transparent 0 79px,rgba(0,0,0,.08) 79px 80px),linear-gradient(#8e959a,#71787d 40%,#5c6267)}
.ground{position:absolute;left:0;top:400px;width:3400px;height:100px;background:repeating-linear-gradient(90deg,transparent 0 59px,rgba(0,0,0,.12) 59px 61px),linear-gradient(#b9bec2 0 8px,#a3a9ad 8px,#8e959a)}
.path{position:absolute;left:0;top:414px;width:3400px;height:6px;background:repeating-linear-gradient(90deg,#f2c230 0 30px,#3a3a3a 30px 40px);opacity:.85}
.deco,.station,#player,.dock{position:absolute;bottom:96px}
.deco{transform-origin:bottom center;z-index:1}
.station{display:flex;align-items:flex-end;gap:10px;transform:translateX(-50%);z-index:2}
.sign{display:flex;flex-direction:column;align-items:center}
.board{background:#f3dfb4;border:4px solid #8a5a2b;border-radius:10px;padding:4px 10px;text-align:center;font-weight:bold;font-size:15px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.board b{display:block;font-size:22px;color:var(--accentDark)}
.post{width:10px;height:50px;background:#7d868c}
.station.done .board{background:#d9eecb;border-color:var(--ok)}
.station.done .board b::after{content:" ✓";color:var(--ok)}
.station.next .sign::before{content:"▼";font-size:30px;color:var(--accent);animation:bounce .7s infinite alternate;text-shadow:0 2px 0 #fff}
@keyframes bounce{to{transform:translateY(-10px)}}
#player{z-index:3;transform:translateX(-50%);bottom:87px!important}
#player::after{content:'';position:absolute;left:14px;right:14px;bottom:1px;height:7px;border-radius:50%;background:rgba(0,0,0,.22);z-index:0}
#player.climb::after{display:none}
#pflip{transition:transform .1s;position:relative}
#pflip>svg{position:relative;z-index:1}
#carry{position:absolute;left:-23px;top:6px;width:50px;height:60px;z-index:2;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.18));transform-origin:50% 100%;transform:rotate(-8deg)}
#carry.pop{animation:carrypop .7s}
@keyframes carrypop{0%{transform:rotate(-8deg) scale(0)}60%{transform:rotate(-8deg) scale(1.35)}100%{transform:rotate(-8deg) scale(1)}}
#player.walk #carry{animation:carrybob .32s infinite alternate}
@keyframes carrybob{to{transform:rotate(-4deg) translateY(-2px)}}
#player #carry.pop{animation:carrypop .55s}
.legL,.legR,.armL,.armR{transform-box:fill-box;transform-origin:50% 0}
g.armR{transform-box:view-box;transform-origin:43.5px 43px}
/* Kittel und Haube */
.coat,.cap{display:none}
#player.dressed .coat,#player.dressed .cap{display:inline}
#player.dressed .shirt{fill:#f4f6f8}
#player.dressed .hat{display:none}
/* Behälter vorne mit beiden Armen halten */
#player.front .armR,#player.front.walk .armR{animation:none;transform:rotate(-30deg)}
#player.front .armL,#player.front.walk .armL{display:none}
#player.front.walk .frontload{animation:bob .16s infinite alternate}
/* Szenen-Posen */
#player.act-point g.armR{animation:none;transform:rotate(-115deg)}
#player.act-scoop g.armR{animation:actScoop .8s ease-in-out infinite}
#player.act-reach g.armR{animation:none;transform:rotate(-70deg)}
#player.act-lift g.armR{animation:none;transform:rotate(-150deg)}
#player.act-crank g.armR{animation:actCrank .7s linear infinite}
#player.climb .legL,#player.climb .armL,#player.climb g.armR{animation:swA .28s infinite alternate}
#player.climb .legR{animation:swB .28s infinite alternate}
@keyframes actScoop{0%,100%{transform:rotate(-25deg)}50%{transform:rotate(-80deg)}}
@keyframes actCrank{0%{transform:rotate(-40deg)}50%{transform:rotate(-100deg)}100%{transform:rotate(-40deg)}}
/* Schüler-/Lehrermodus */
#tbadge{position:fixed;left:50%;bottom:calc(2px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:#2f4a7a;color:#fff;font-weight:bold;font-size:13px;padding:3px 12px;border-radius:12px;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.skipbtn{border:none;background:var(--ui);color:var(--ink);font-weight:bold;font-size:14px;padding:6px 12px;border-radius:16px;box-shadow:0 2px 0 #c9b28f;cursor:pointer;pointer-events:auto;white-space:nowrap}
.skiprow{display:flex;justify-content:flex-end;margin:8px 0 2px}
.waitnote{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
#bubble .skipbtn{margin-top:6px;font-size:13px;padding:4px 10px}
#tstation{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:calc(112px + env(safe-area-inset-bottom,0px));z-index:10;font-size:15px;padding:9px 14px}
body.scene-on #tstation{display:none}
/* Meister Lenz */
#guide{position:fixed;left:max(10px,env(safe-area-inset-left));top:120px;display:flex;align-items:flex-start;gap:6px;z-index:9;max-width:min(560px,calc(100vw - 20px));pointer-events:none}
#guide .meister{width:68px;height:86px;flex:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.3))}
#bubble{position:relative;background:var(--ui);border-radius:16px;padding:8px 13px 9px;box-shadow:0 4px 14px rgba(0,0,0,.22);margin-top:6px}
#bubble::before{content:"";position:absolute;left:-10px;top:24px;border:10px solid transparent;border-right-color:var(--ui);border-left:0}
#bubble .who{font-weight:bold;font-size:13px;color:var(--accentDark)}
#bubble .say{font-size:16px;line-height:1.32}
.meister .mouth{transform-box:fill-box;transform-origin:50% 50%}
.meister.talk .mouth{animation:talk .2s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.3)}to{transform:scaleY(1.3)}}
.mintro{display:flex;align-items:flex-start;gap:10px}
.mintro .meister{width:64px;height:80px;flex:none;margin-top:4px}
.mintro .intro{flex:1;min-width:0}
.waitnote{background:#eef3fb;color:#2f4a7a;border-radius:12px;padding:7px 12px;margin-bottom:10px;font-weight:bold;font-size:15px;text-align:center}
#area.wait{pointer-events:none;opacity:.5;filter:saturate(.55)}
.sv{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);height:100%;aspect-ratio:400/250;max-width:100%}
.sv .tapit svg{display:block;width:100%;height:auto}
.scene{position:absolute;bottom:96px;z-index:2;pointer-events:none}
.scene .sp{position:absolute;line-height:0}

.p-flame,.p-crusher,.p-paddle,.p-fan,.p-wheel,.p-hand,.p-molds,.p-roller{transform-box:fill-box}
.p-flame{transform-origin:50% 100%}
.p-roll{transform-box:fill-box;transform-origin:50% 50%}
.p-fan,.p-wheel,.p-paddle,.p-rstone,.p-fly{transform-box:fill-box;transform-origin:50% 50%}
.p-hand{transform-origin:50% 100%}
#skip{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:12;border:none;background:var(--ui);color:var(--ink);font-weight:bold;font-size:16px;padding:12px 20px;border-radius:30px;box-shadow:0 4px 0 #c9b28f}
body.scene-on .ctl{opacity:.35;pointer-events:none}
.deco{transition:opacity .4s}.deco.away{opacity:0}
.dock .whl{transform-box:fill-box;transform-origin:50% 50%}
.gbowl{position:absolute;bottom:96px;z-index:2;line-height:0;transform:translateX(-50%)}
.gbowl.want::before,#stand.want::before{content:'▼';position:absolute;left:-20px;right:-20px;text-align:center;top:-36px;font-size:26px;color:var(--accent);text-shadow:0 2px 0 #fff;line-height:1;animation:bounce .7s infinite alternate;z-index:3}
#stand{position:absolute;bottom:96px;width:60px;height:150px;margin-left:-30px;z-index:2;line-height:0}
#stand .gear{transition:opacity .2s}
#player.walk .legL,#player.walk .armR{animation:swA .32s infinite alternate}
#player.walk .legR,#player.walk .armL{animation:swB .32s infinite alternate}
#player.walk svg{animation:bob .16s infinite alternate}
@keyframes swA{from{transform:rotate(22deg)}to{transform:rotate(-22deg)}}
@keyframes swB{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
@keyframes bob{to{transform:translateY(-3px)}}

/* HUD */
#hud{position:fixed;top:env(safe-area-inset-top,0px);left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 12px;z-index:10;pointer-events:none}
#hud>*{pointer-events:auto}
.pill{background:var(--ui);border-radius:16px;padding:7px 12px;box-shadow:0 3px 10px rgba(0,0,0,.15);font-weight:bold}
#progress{display:flex;gap:5px;align-items:center}
.slot{width:28px;height:28px;border-radius:50%;background:#eadcc4;display:grid;place-items:center;font-size:14px;color:#a08a6a;transition:.3s}
.slot.done{background:var(--accent);color:#fff;transform:scale(1.1)}
#tip{position:fixed;top:58px;left:50%;transform:translateX(-50%);z-index:9;font-size:15px;width:max-content;max-width:calc(100vw - 24px);text-align:center;line-height:1.35}
#tip .go{display:block;font-size:16px}
#tip .have{display:block;font-weight:normal;font-size:14px;opacity:.85}
@media (max-width:440px){.mbt{display:none}#hud{padding:8px}#hud .pill{padding:6px 9px;font-size:14px}#progress{gap:3px}.slot{width:22px;height:22px;font-size:11px}#fsbtn,#sndbtn{font-size:15px!important;padding:6px 8px!important}}
.ctl{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:74px;height:74px;border-radius:50%;font-size:32px;border:none;background:rgba(255,250,240,.95);box-shadow:0 5px 0 #c9b28f;z-index:10;color:var(--ink);touch-action:none}
.ctl:active,.ctl.on{transform:translateY(3px);box-shadow:0 2px 0 #c9b28f}
#left{left:calc(16px + env(safe-area-inset-left,0px))}#right{right:calc(16px + env(safe-area-inset-right,0px))}
#action{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:10;font-size:18px;padding:14px 22px;border-radius:40px;border:none;background:var(--accent);color:#fff;font-weight:bold;box-shadow:0 5px 0 var(--accentDark);display:none;max-width:calc(100vw - 196px);animation:pulse 1.2s infinite}
#action.locked{background:#9c8b78;box-shadow:0 5px 0 #6f6152;animation:none}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.05)}}

/* Modal */
#modal{position:fixed;inset:0;background:rgba(40,25,10,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:10px}
#modal.open{display:flex}
.card{background:var(--ui);border-radius:22px;width:min(720px,100%);max-height:100%;overflow:auto;padding:16px 18px 18px;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:pop .3s}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.head h2{margin:0;font-size:22px}
.num{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:bold;font-size:19px;flex:none}
.iconbtn{border:none;background:#f1e3c8;border-radius:12px;width:42px;height:42px;font-size:19px;flex:none}
.head .iconbtn:first-of-type{margin-left:auto}
.intro{font-size:17px;line-height:1.45;margin:6px 0 10px}
#cnt{white-space:nowrap}
.taskline{font-weight:bold;font-size:16px;display:flex;justify-content:space-between;gap:10px;background:#fdecc8;padding:8px 12px;border-radius:12px;margin-bottom:10px}
.hint{min-height:22px;color:#b0451a;font-weight:bold;margin:8px 0 0;text-align:center;font-size:16px}
.hint.good{color:var(--ok)}
.fact{background:#e3f2d9;border-left:6px solid var(--ok);padding:10px 14px;border-radius:10px;margin-top:10px;font-size:16px;line-height:1.4;animation:pop .4s}
.btn{border:none;background:var(--accent);color:#fff;font-weight:bold;font-size:17px;padding:12px 20px;border-radius:30px;box-shadow:0 4px 0 var(--accentDark)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accentDark)}
.btn:disabled{opacity:.45}
.btn.green{background:var(--ok);box-shadow:0 4px 0 #2e6b24}
.btn.big{display:block;margin:14px auto 0;font-size:19px;padding:14px 26px}
.row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:10px}

/* Aufgaben-Bühnen */
.stage{position:relative;height:250px;border-radius:16px;background:linear-gradient(#eef1f3,#d5dbdf);overflow:hidden;touch-action:manipulation}
.tapit{position:absolute;transform:translate(-50%,-50%);background:none;border:none;padding:0;line-height:0;cursor:pointer}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translate(-58%,-50%)}75%{transform:translate(-42%,-50%)}}
.bin{position:absolute;right:14px;bottom:14px;width:74px;height:70px;background:#7d868c;border-radius:6px 6px 12px 12px;border-top:6px solid #5f676c;color:#fff;font-weight:bold;font-size:12px;display:grid;place-items:center;text-align:center}
.bar{height:26px;background:#eadcc4;border-radius:13px;overflow:hidden;margin-top:10px;position:relative}
.bar .bf{height:100%;width:0;background:linear-gradient(90deg,#c48a4a,#7a4a24);transition:width .3s}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-weight:bold;font-size:14px}
.roastbar{position:relative;height:30px;border-radius:15px;margin-top:10px;background:linear-gradient(90deg,#d9b68a 0 55%,#8fcf7a 55% 80%,#d9542b 80%);overflow:visible}
.roastbar .zl{position:absolute;top:0;bottom:0;display:grid;place-items:center;font-size:12px;font-weight:bold;color:#3a2414}
.roastbar .mk{position:absolute;top:-6px;bottom:-6px;width:6px;margin-left:-3px;background:#3a2414;border-radius:3px;box-shadow:0 0 0 2px #fff}
.ingr{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.ing{border:3px solid #eadcc4;background:#fff;border-radius:14px;padding:6px 10px;font-size:15px;font-weight:bold;color:var(--ink);display:flex;align-items:center;gap:6px}
.ing.used{opacity:.35;pointer-events:none}
.ing.no{animation:nope .4s}
@keyframes nope{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.snow{position:absolute;inset:0;z-index:2;overflow:hidden;background:rgba(150,200,240,.0);transition:background .4s,box-shadow .5s;pointer-events:none}
.snow.on{background:rgba(120,185,240,.5);box-shadow:inset 0 0 46px 20px rgba(255,255,255,.85)}
.crystal{position:absolute;line-height:0;opacity:0;animation:crystal 2s ease-out forwards}
@keyframes crystal{0%{opacity:0;transform:scale(.15) rotate(0deg)}35%{opacity:1}75%{opacity:1;transform:scale(1) rotate(70deg)}100%{opacity:0;transform:scale(1.08) translateY(12px) rotate(95deg)}}

/* Ende / Start */
.steps{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.step{background:#fdecc8;border-radius:14px;padding:8px 10px;text-align:center;width:110px;font-size:14px}
.step big{display:block;font-size:28px}
.opt{display:block;width:100%;text-align:left;border:3px solid #eadcc4;background:#fff;border-radius:14px;padding:12px 14px;font-size:17px;margin:8px 0;color:var(--ink)}
.opt.right{border-color:var(--ok);background:#e3f2d9}
.opt.wrong{border-color:#d9542b;background:#fbe1d6}
.cert{border:6px double var(--accent);border-radius:18px;padding:20px;text-align:center;background:#fffdf6}
.cert h1{margin:6px 0;font-size:28px;color:var(--accentDark)}
.cert .nm{font-size:26px;font-weight:bold;border-bottom:2px solid var(--ink);display:inline-block;padding:0 20px 2px;margin:8px 0}
.think{background:#eef3fb;border-left:6px solid #5a83c4;padding:10px 14px;border-radius:10px;margin-top:12px;font-size:15px;line-height:1.4}
input.name{font-size:19px;padding:10px 14px;border-radius:12px;border:3px solid #eadcc4;width:min(280px,100%);text-align:center;font-family:inherit}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (max-height:520px){.mintro .meister{width:46px;height:58px}#guide .meister{width:52px;height:66px}#bubble .say{font-size:14px}.stage{height:200px}.intro{font-size:15px;margin:2px 0 6px}.card{padding:12px 14px}}
@media (prefers-reduced-motion:reduce){.station.next .sign::before,.gbowl.want::before,#stand.want::before,#action{animation:none}}
</style>

  <div style="display:flex;gap:6px;align-items:flex-start"><button class="pill" id="menubtn" aria-label="Spielmenü öffnen" title="Spielmenü" style="border:none;font-size:inherit;font-family:inherit;color:inherit;cursor:pointer">☰<span class="mbt"> Schokoladenfabrik</span></button><button class="pill" id="fsbtn" aria-label="Vollbild" title="Vollbild" style="border:none;font-size:17px;padding:7px 11px">⛶</button><button class="pill" id="sndbtn" style="border:none;font-size:17px;padding:7px 11px"></button></div>

<script>
const $=q=>document.querySelector(q);
const W=3400,H=500,END_X=3175,HX=330; // HX: Hygieneschleuse (Kittel und Haube)
let s=1,offY=0,cam=0,px=140,dir=1,target=null,modalOpen=true,done=0,playerName='';
const keys={left:false,right:false};
function rng(seed){return()=>(seed=(seed*16807)%2147483647)/2147483647}
/* ---------- Ton: Fabrikhalle und Maschinen (alles live im Browser erzeugt, keine Audiodateien) ---------- */
const Sfx=(()=>{
 const AC=window.AudioContext||window.webkitAudioContext;
 const NOOP={stop(){},move(){}};
 const loops=new Set();
 let ctx=null,master,amb,mach,rev,white,brown,started=false,muted=false,ducked=0;
 try{muted=localStorage.getItem('fabrikTon')==='aus'}catch(e){}
 const rnd=(a,b)=>a+Math.random()*(b-a);
 const running=()=>!!ctx&&ctx.state==='running';
 function noiseBuffer(isBrown){const sr=ctx.sampleRate,n=sr*3|0,x=sr*.1|0,raw=new Float32Array(n+x);let l=0;
  for(let i=0;i<n+x;i++){const w=Math.random()*2-1;if(isBrown){l=(l+.02*w)/1.02;raw[i]=l*3.5}else raw[i]=w}
  const b=ctx.createBuffer(1,n,sr),d=b.getChannelData(0);d.set(raw.subarray(0,n));
  for(let i=0;i<x;i++)d[i]=raw[i]*(i/x)+raw[n+i]*(1-i/x); // nahtlos schleifen
  return b}
 function hallImpulse(){const sr=ctx.sampleRate,n=sr*2|0,b=ctx.createBuffer(2,n,sr);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);let lp=0;for(let i=0;i<n;i++){const k=i/n;lp+=(Math.random()*2-1-lp)*(.5-.42*k);d[i]=lp*Math.pow(1-k,3)}}
  return b}
 function init(){
  if(ctx||!AC)return;
  try{ctx=new AC()}catch(e){ctx=null;return}
  master=ctx.createGain();master.gain.value=muted?0:1;
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-12;comp.ratio.value=6;comp.attack.value=.004;comp.release.value=.18;
  master.connect(comp);comp.connect(ctx.destination);
  amb=ctx.createGain();amb.gain.value=0;amb.connect(master);
  mach=ctx.createGain();mach.gain.value=.85;mach.connect(master);
  white=noiseBuffer(false);brown=noiseBuffer(true);
  rev=ctx.createGain();rev.gain.value=1;const con=ctx.createConvolver();con.buffer=hallImpulse();const wet=ctx.createGain();wet.gain.value=.55;rev.connect(con);con.connect(wet);wet.connect(master);
 }
 // Beim ersten Tippen/Klicken starten; danach holt jede Geste einen unterbrochenen Ton zurück
 function unlock(){init();if(!ctx)return;
  const go=()=>{if(!started&&ctx.state==='running'){started=true;startAmbient()}};
  if(ctx.state!=='running'){const r=ctx.resume();if(r&&r.then)r.then(go).catch(()=>{})}else go()}
 ['pointerdown','touchend','click','keydown'].forEach(ev=>addEventListener(ev,unlock,{capture:true,passive:true}));
 document.addEventListener('visibilitychange',()=>{if(!ctx)return;if(document.hidden){if(ctx.suspend)ctx.suspend().catch(()=>{})}else ctx.resume().catch(()=>{})});
 function applyLevel(){if(ctx)master.gain.setTargetAtTime(muted?0:ducked||1,ctx.currentTime,.08)}

 /* Bausteine für Einzelgeräusche */
 function route(node,to,send){node.connect(to||mach);if(send){const s=ctx.createGain();s.gain.value=send;node.connect(s);s.connect(rev)}}
 function env(g,t,peak,a,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
 function nz({buf,type='bandpass',f=1000,f2,q=1,t=0,a=.002,d=.08,g=.3,to,send=.15}){const t0=ctx.currentTime+.005+t;
  const s=ctx.createBufferSource();s.buffer=buf||white;const fl=ctx.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t0);fl.Q.value=q;if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t0+a+d);
  const v=ctx.createGain();env(v,t0,g,a,d);s.connect(fl);fl.connect(v);route(v,to,send);s.start(t0,rnd(0,2.4));s.stop(t0+a+d+.03)}
 function tn({w='sine',f=200,f2,t=0,a=.002,d=.1,g=.3,to,send=.1}){const t0=ctx.currentTime+.005+t;
  const o=ctx.createOscillator();o.type=w;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+a+d);
  const v=ctx.createGain();env(v,t0,g,a,d);o.connect(v);route(v,to,send);o.start(t0);o.stop(t0+a+d+.03)}
 const metal=(f,g,d,t=0,to,send=.5)=>[1,2.76,5.4,8.9].forEach((m,i)=>tn({w:'sine',f:f*m*rnd(.99,1.01),d:d/(1+i*.7),g:g/(1+i),t,to,send}));

 /* Einzelgeräusche */
 const ONE={
  bean:v=>nz({f:rnd(1900,3800),q:5,d:rnd(.012,.03),g:.9*v,send:.05}),                 // einzelne Bohne
  beans:v=>{for(let i=0;i<7;i++)nz({f:rnd(1500,3400),q:4,d:rnd(.015,.04),g:rnd(.4,.9)*v,t:i*rnd(.018,.04),send:.1})}, // Hand voll Bohnen
  beanMetal:v=>{for(let i=0;i<4;i++){nz({f:rnd(2600,4600),q:7,d:.03,g:.7*v,t:i*.028,send:.12});tn({f:rnd(1500,2300),d:.03,g:.1*v,t:i*.028})}}, // Bohnen auf Blech
  stone:v=>{tn({w:'square',f:190,f2:85,d:.07,g:.2*v,send:.25});nz({f:800,q:1.2,d:.06,g:.7*v,send:.3});metal(310,.09*v,.22,.005)}, // Stein in Metallbehälter
  clack:v=>{nz({f:1500,q:1,d:.04,g:.8*v,send:.4});metal(420,.13*v,.26);tn({w:'square',f:120,f2:60,d:.08,g:.14*v})},
  crack:v=>{nz({type:'highpass',f:1800,q:.7,d:.028,g:.8*v,send:.1});tn({w:'triangle',f:320,f2:110,d:.05,g:.32*v,send:.05})}, // Knack!
  crunch:v=>{nz({f:rnd(1600,2800),q:1.5,d:.04,g:.75*v,send:.1});nz({f:rnd(500,900),q:1.5,d:.06,g:.55*v,t:.02,send:.1});tn({w:'triangle',f:rnd(120,150),f2:60,d:.08,g:.32*v})}, // Brecher
  whoosh:v=>{nz({f:380,f2:2600,q:1.1,a:.32,d:.1,g:.8*v,send:.3});nz({f:2600,f2:500,q:1.1,a:.05,d:.55,g:.55*v,t:.38,send:.35})},
  plop:v=>{nz({type:'lowpass',f:800,f2:220,q:.7,d:.14,g:.75*v,send:.15});tn({f:210,f2:95,d:.1,g:.36*v})},       // Pulver/Zutat fällt hinein
  glug:v=>{const f=rnd(170,250);tn({f,f2:f*rnd(1.9,2.5),a:.006,d:rnd(.06,.11),g:.42*v,send:.08})},                // Blubbern
  fill:v=>{for(let i=0;i<6;i++){const f=rnd(180,240)+i*22;tn({f,f2:f*2.1,a:.006,d:.08,g:.42*v,t:i*.08,send:.08})}}, // Form läuft voll
  knock:v=>[0,.12].forEach((t,i)=>{tn({w:'triangle',f:i?300:430,f2:i?190:260,d:.07,g:.5*v,t,send:.2});nz({f:1200,q:1,d:.02,g:.4*v,t,send:.1})}),
  foil:v=>{for(let i=0;i<14;i++)nz({type:'highpass',f:rnd(3500,7000),q:1,d:rnd(.008,.022),g:rnd(.15,.5)*v,t:i*rnd(.012,.02),send:.05})}, // Folie knistert
  stamp:v=>{tn({w:'triangle',f:150,f2:60,d:.1,g:.42*v,send:.2});nz({f:700,q:1,d:.05,g:.5*v,send:.2});nz({type:'highpass',f:3200,q:.7,d:.09,g:.22*v,t:.07,send:.1})}, // Verpackungsmaschine
  thud:v=>{tn({w:'triangle',f:125,f2:70,d:.12,g:.5*v,send:.15});nz({type:'lowpass',f:650,q:.7,d:.07,g:.5*v,send:.15})}, // Karton
  slide:v=>{nz({f:1100,f2:1900,q:2,a:.15,d:.85,g:.28*v,send:.25});for(let i=0;i<4;i++)metal(560,.05*v,.1,i*.26)},  // Formen gleiten auf Metall
  tick:v=>{nz({f:3400,q:9,d:.012,g:.55*v,send:.05});tn({f:1250,d:.012,g:.1*v})},
  chain:v=>{nz({f:rnd(1000,1500),q:3,d:.03,g:.42*v,send:.15});tn({f:210,f2:140,d:.03,g:.1*v})}
 };
 function play(name,v=1,delay=0){if(!running()||!ONE[name])return;if(delay){setTimeout(()=>{if(running())ONE[name](v)},delay);return}ONE[name](v)}

 /* Bausteine für Dauergeräusche */
 function band(l,buf,type,f,q,g){const s=ctx.createBufferSource();s.buffer=buf;s.loop=true;s.loopEnd=3;const fl=ctx.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const v=ctx.createGain();v.gain.value=g;s.connect(fl);fl.connect(v);v.connect(l.g);s.start(0,rnd(0,2.5));l.srcs.push(s);return {s,fl,v}}
 function tone(l,w,f,g){const o=ctx.createOscillator();o.type=w;o.frequency.value=f;const v=ctx.createGain();v.gain.value=g;o.connect(v);v.connect(l.g);o.start();l.srcs.push(o);return {o,v}}
 function lfo(l,rate,depth,param,w='sine'){const o=ctx.createOscillator();o.type=w;o.frequency.value=rate;const v=ctx.createGain();v.gain.value=depth;o.connect(v);v.connect(param);o.start();l.srcs.push(o);return o}
 function motor(l,f,g,cut){const fl=ctx.createBiquadFilter();fl.type='lowpass';fl.frequency.value=cut||900;fl.Q.value=.8;fl.connect(l.g);const v=ctx.createGain();v.gain.value=g;v.connect(fl);
  const os=[1,1.008,2.01].map((m,i)=>{const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=f*m;if(i===2){const h=ctx.createGain();h.gain.value=.35;o.connect(h);h.connect(v)}else o.connect(v);o.start();l.srcs.push(o);return o});
  return {os,fl,v}}
 /* Die Maschinen */
 const LOOP={
  belt:l=>{motor(l,62,.13,950);const b=band(l,white,'bandpass',2300,2.2,.6);lfo(l,14,.55,b.v.gain,'square');l.every(85,()=>{if(Math.random()>.4)ONE.bean(.6)})},          // Rüttelband
  conveyor:l=>{motor(l,74,.2,1500);l.every(200,()=>ONE.chain(1.4))},                                                                                                          // Förderband
  roast:l=>{const b=band(l,brown,'lowpass',620,.6,.7);lfo(l,8.5,.2,b.v.gain);band(l,white,'bandpass',1500,.7,.14);tone(l,'sine',58,.3);motor(l,46,.1,700);const t0=performance.now();l.every(72,()=>ONE.bean(.42+.38*Math.sin((performance.now()-t0)/170)))}, // Brenner und Trommel
  crush:l=>{motor(l,86,.13,1100);l.every(160,()=>ONE.crunch(rnd(.7,1)))},                                                                                                    // Brecher
  fan:l=>{const b=band(l,white,'bandpass',950,.8,.42);lfo(l,13.3,.16,b.v.gain);tone(l,'triangle',266,.03)},                                                                  // Gebläse
  grind:l=>{const m=motor(l,72,.3,800);const b=band(l,white,'bandpass',360,1,.75);lfo(l,1.55,.3,b.v.gain);band(l,white,'highpass',3000,.7,.05);lfo(l,6,4,m.os[0].frequency)}, // Mühle
  stream:l=>{band(l,white,'lowpass',720,.7,.1);l.every(95,()=>ONE.glug(rnd(.5,1)))},                                                                                         // Masse läuft aus
  mix:l=>{motor(l,55,.15,800);const b=band(l,white,'bandpass',540,.9,.65);lfo(l,2,.45,b.v.gain);l.every(250,()=>ONE.glug(.55))},                                             // Rührarm
  conche:l=>{const b=band(l,brown,'lowpass',340,.7,.7);lfo(l,1.82,.28,b.v.gain);motor(l,66,.13,700);const c=band(l,white,'bandpass',780,1.2,.45);lfo(l,1.82,.3,c.v.gain);l.every(275,()=>ONE.tick(.7));l.every(340,()=>ONE.glug(.4))}, // Walze und schnelle Uhr
  cool:l=>{const b=band(l,white,'highpass',3200,.7,.13);lfo(l,.9,.03,b.v.gain);band(l,white,'bandpass',700,.7,.1);tone(l,'sine',120,.13);tone(l,'sine',240,.06)},             // Kühltunnel
  wrap:l=>{motor(l,142,.08,1500);l.every(48,()=>{if(Math.random()>.45)nz({type:'highpass',f:rnd(3500,7000),q:1,d:.014,g:rnd(.12,.34),send:.04})})},                           // Verpackung
  truck:l=>{const m=motor(l,40,.34,500);const t=ctx.currentTime,sec=(l.dur||2300)/1000;m.os.forEach(o=>o.frequency.exponentialRampToValueAtTime(o.frequency.value*2.6,t+sec));m.fl.frequency.exponentialRampToValueAtTime(1300,t+sec);band(l,brown,'lowpass',260,.7,.8)}
 };
 function makeLoop(name,dur,level,fade=.1){
  const g=ctx.createGain(),t=ctx.currentTime;g.gain.setValueAtTime(0,t);if(level)g.gain.linearRampToValueAtTime(level,t+fade);g.connect(mach);
  const s=ctx.createGain();s.gain.value=.12;g.connect(s);s.connect(rev);
  const l={g,srcs:[],ivs:[],dur,every(ms,fn){l.ivs.push(setInterval(()=>{if(running())fn()},ms))},
   stop(f=.16){if(l.off)return;l.off=true;loops.delete(l);l.ivs.forEach(clearInterval);clearTimeout(l.tm);if(!ctx)return;const n=ctx.currentTime;g.gain.cancelScheduledValues(n);g.gain.setValueAtTime(g.gain.value,n);g.gain.setTargetAtTime(0,n,f/3);l.srcs.forEach(x=>{try{x.stop(n+f*1.6)}catch(e){}});setTimeout(()=>{try{g.disconnect();s.disconnect()}catch(e){}},f*1600+200)}};
  LOOP[name](l);loops.add(l);if(dur)l.tm=setTimeout(()=>l.stop(),dur);return l}
 function loop(name,dur){if(!running()||!LOOP[name])return NOOP;try{return makeLoop(name,dur,.8)}catch(e){console.warn(e);return NOOP}}
 // Maschine, die direkt am Finger hängt: je schneller gedreht/gewischt wird, desto lauter
 function drag(name,ref){if(!LOOP[name])return NOOP;let l=null,last=0,idle=null;
  return {move(d){if(!running()||d<=0)return;if(!l||l.off)l=makeLoop(name,0,0);const t=performance.now(),dt=Math.max(8,t-last);last=t;
    l.g.gain.setTargetAtTime(.25+.6*Math.min(1,d/(dt/1000)/ref),ctx.currentTime,.03);clearTimeout(idle);idle=setTimeout(()=>{if(l&&!l.off)l.g.gain.setTargetAtTime(0,ctx.currentTime,.05)},110)},
   stop(){clearTimeout(idle);if(l)l.stop()}}}

 /* Grundgeräusch der Halle */
 function startAmbient(){const l={g:amb,srcs:[]};
  band(l,brown,'lowpass',180,.6,.6);                                   // tiefes Grollen
  const air=band(l,white,'bandpass',620,.6,.15);lfo(l,.13,.05,air.v.gain); // Lüftung, langsam atmend
  band(l,brown,'bandpass',420,.8,.6);                                   // entfernte Maschinen
  tone(l,'sine',100,.03);tone(l,'sine',150,.018);tone(l,'triangle',300,.006); // Netzbrummen, auch auf Tablet-Lautsprechern hörbar
  amb.gain.setValueAtTime(0,ctx.currentTime);amb.gain.linearRampToValueAtTime(.36,ctx.currentTime+2.5);
  // eine entfernte Stanze arbeitet gleichmäßig vor sich hin
  setInterval(()=>{if(!running())return;[0,.42,.84,1.26].forEach((t,i)=>{nz({f:i%2?950:540,q:1.2,d:.09,g:i?.05:.09,t,to:amb,send:.7});tn({w:'triangle',f:96,f2:58,d:.1,g:i?.04:.08,t,to:amb,send:.4})})},1680);
  // ab und zu passiert irgendwo in der Halle etwas
  const events=[()=>metal(rnd(260,420),.05,.5,0,amb,.9),
   ()=>nz({type:'highpass',f:2200,f2:1200,q:.7,a:.03,d:rnd(.5,.9),g:.05,to:amb,send:.6}),
   ()=>{for(let i=0;i<7;i++)nz({f:rnd(900,1500),q:3,d:.03,g:.07,t:i*.11,to:amb,send:.8})},
   ()=>[0,.22].forEach(t=>metal(rnd(180,240),.05,.35,t,amb,.9))];
  const next=()=>setTimeout(()=>{if(running())events[Math.random()*events.length|0]();next()},rnd(2800,8000));next()}

 return {play,loop,drag,
  stopLoops(f){[...loops].forEach(l=>l.stop(f))},
  duck(on,lvl){ducked=on?(lvl||.28):0;applyLevel()},
  isMuted:()=>muted,
  toggle(){muted=!muted;try{localStorage.setItem('fabrikTon',muted?'aus':'an')}catch(e){}applyLevel();return muted}};
})();

const ttsText=t=>t.replace(/<[^>]+>/g,'').replace(/Conchieren/g,'Konschieren').replace(/Conche/g,'Konsche').replace(/„|“/g,'');

function speak(t,onDone,lvl){stopSpeech();const id=speakId;
 const finish=()=>{if(id!==speakId)return;speakId++;clearTimeout(speakTm);talk(false);Sfx.duck(false);if(onDone)onDone()};

  const u=new SpeechSynthesisUtterance(parts[i++].trim());u.lang='de-DE';u.rate=.95;if(gVoice)u.voice=gVoice;u.pitch=gVoice?.95:.72;u.onend=next;u.onerror=next;speechSynthesis.speak(u)};

 const dt=Math.min(.05,(t-last)/1000||0);last=t;
 let v=0;
 if(!modalOpen){if(!scene&&keys.left)v=-1;else if(!scene&&keys.right)v=1;else if(target!==null){if(Math.abs(target-px)>8)v=Math.sign(target-px);else target=null}}

function hold(id,k){const b=$(id);const on=e=>{e.preventDefault();keys[k]=true;target=null;b.classList.add('on')};const off=()=>{keys[k]=false;b.classList.remove('on')};
 b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,off))}
hold('#left','left');hold('#right','right');
$('#action').onclick=act;
$('#game').addEventListener('pointerdown',e=>{if(!modalOpen&&!scene)target=cam+e.clientX/s});
addEventListener('keydown',e=>{if(e.key==='Escape'){if(!modalOpen&&!scene)openMenu();return}if(e.target.tagName==='INPUT')return;if(['ArrowLeft','a','A'].includes(e.key)){keys.left=true;target=null}if(['ArrowRight','d','D'].includes(e.key)){keys.right=true;target=null}if((e.key===' '||e.key==='Enter')&&!modalOpen){e.preventDefault();act()}});
addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if(['ArrowRight','d','D'].includes(e.key))keys.right=false});
addEventListener('resize',layout);
$('#gfig').innerHTML=MEISTER;build();renderGround();updateCarry();layout();openStart();$('#carry').addEventListener('animationend',e=>{if(e.animationName==='carrypop')e.currentTarget.classList.remove('pop')});requestAnimationFrame(loop);
</script>


</body></html>
